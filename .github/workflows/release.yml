name: Release

# Push a tag vX.Y.Z matching the version in Cargo.toml to publish a release.
# Run manually (workflow_dispatch) for a dry run: builds everything, publishes
# nothing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Cargo.toml version '$version' is not semantic versioning"
            exit 1
          fi
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The full CI (lint + tests on every platform) for the tagged commit.
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # `name` goes in the archive name: the target without its vendor, and
          # glibc instead of gnu.
          # glibc builds on Ubuntu 22.04: an older glibc, so they run on more
          # distros. musl builds are static and run on any Linux.
          - target: x86_64-unknown-linux-gnu
            name: x86_64-linux-glibc
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            name: aarch64-linux-glibc
            os: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            name: x86_64-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            name: aarch64-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            name: aarch64-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            name: x86_64-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            name: x86_64-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      # C dependencies (ring, aws-lc) must be compiled against musl too.
      - if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy musl-tools
          target=${{ matrix.target }}
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin=target/$TARGET/release/leeroy
          [[ $RUNNER_OS == Windows ]] && bin+=.exe
          # x86_64 macOS binaries can't run on the ARM runner.
          if [[ $TARGET != x86_64-apple-darwin ]]; then
            "$bin" --version
          fi
          if [[ $TARGET == *-musl ]]; then
            file "$bin"
            file "$bin" | grep -Eq 'static(ally|-pie) linked' \
              || { echo "::error::musl binary isn't statically linked"; exit 1; }
          fi
      - name: Package
        shell: bash
        run: |
          name="leeroy-v${{ needs.version.outputs.version }}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          if [[ "${{ runner.os }}" == Windows ]]; then
            cp "target/${{ matrix.target }}/release/leeroy.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/leeroy" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: leeroy-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        shell: bash
        run: |
          (cd dist && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS dist/
          # This version's section of the changelog.
          awk -v v="${{ needs.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for ${{ needs.version.outputs.version }}"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: Leeroy v${{ needs.version.outputs.version }}
          body_path: notes.md
          files: dist/*
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
