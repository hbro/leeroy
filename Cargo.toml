[package]
name = "leeroy"
version = "0.3.0"
edition = "2024"
description = "Terminal UI for Jenkins"
license = "MIT"
repository = "https://github.com/hbro/leeroy"
readme = "README.md"
keywords = ["jenkins", "tui", "ci", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "charset", "json", "socks", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
terminal-colorsaurus = "1.0.3"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
insta = "1.48.0"
wiremock = "0.6.5"
